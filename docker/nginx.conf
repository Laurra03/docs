user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    server_tokens   off;
    keepalive_timeout 65;
    client_max_body_size 64M;
    client_body_temp_path /tmp/nginx_client_body;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    proxy_temp_path       /tmp/nginx_proxy;
    scgi_temp_path        /tmp/nginx_scgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;

    # Compile responses are base64 PDFs inside JSON - they compress well.
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.php;

        access_log /dev/stdout;
        error_log  /dev/stderr;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Share tokens live in the URL - never leak them to CDNs via Referer.
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

        # ── Never served ─────────────────────────────────────────────────────
        # "^~" matters: without it the regex PHP location below would win and
        # a user-uploaded data/{id}/x.php would be EXECUTED.
        location ^~ /data/     { return 404; }
        location ^~ /ssh_keys/ { return 404; }
        location ^~ /docker/   { return 404; }
        location ~ /\.         { return 404; }
        location ~* (^/Dockerfile|^/docker-compose|\.(md|sql|sh|yml|yaml|conf|example|lock|log|bak)$) { return 404; }

        # ── PHP: only the known entry points are executable ─────────────────
        location ~ ^/(index|editor|settings|shared)\.php$ { include /etc/nginx/php.conf; }
        location ~ ^/(api|auth|css)/[a-zA-Z0-9_]+\.php$   { include /etc/nginx/php.conf; }
        location ~ \.php$ { return 404; }

        location ~* \.(ttf|woff2?|svg)$ {
            expires 7d;
            try_files $uri =404;
        }

        location / {
            rewrite ^/settings$             /settings.php last;
            rewrite ^/editor/(\d+)$         /editor.php   last;
            rewrite ^/shared/([a-f0-9]+)$   /shared.php?t=$1 last;

            try_files $uri $uri/ =404;
        }
    }
}
