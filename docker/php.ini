; App-specific PHP settings (copied to conf.d).
; PHP's defaults (2M uploads, 8M POST) silently broke larger uploads/imports;
; keep these in line with client_max_body_size in nginx.conf.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_input_time = 300

; Never show errors to visitors; send them to the container log instead.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1209600
session.save_path = /var/lib/php/sessions
